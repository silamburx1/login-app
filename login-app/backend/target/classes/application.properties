spring.application.name=loginapp

# Database connection - reads from environment variables, with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logindb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port - many hosting platforms inject PORT automatically
server.port=${PORT:8080}
